<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="bowlGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>
    <linearGradient id="sevGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgGrad)" />
  <circle cx="300" cy="200" r="170" fill="#fde68a" opacity="0.4" />
  
  <!-- Bowl Base -->
  <ellipse cx="300" cy="290" rx="200" ry="25" fill="#000000" opacity="0.1" />
  <path d="M 120 200 C 120 310, 480 310, 480 200 Z" fill="url(#bowlGrad)" />
  <ellipse cx="300" cy="200" rx="180" ry="30" fill="#c2410c" />
  
  <!-- Sev Pile -->
  <ellipse cx="300" cy="180" rx="160" ry="50" fill="url(#sevGrad)" />
  
  <!-- Fine Nylon Sev Strands -->
  <g stroke="#ca8a04" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M 170 170 Q 200 130 250 160 T 320 140 T 400 170" />
    <path d="M 190 190 Q 230 150 280 180 T 360 160 T 430 180" />
    <path d="M 150 180 Q 220 130 270 170 T 350 150 T 420 190" />
    <path d="M 210 160 Q 260 120 310 150 T 390 140 T 440 170" />
    <path d="M 180 185 Q 240 140 290 165 T 370 145 T 410 185" />
    <path d="M 230 150 Q 280 110 330 140 T 410 130 T 450 160" />
    <path d="M 160 195 Q 210 160 260 185 T 340 165 T 390 195" />
  </g>
  <g stroke="#eab308" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M 220 170 Q 270 135 320 160 T 380 150" />
    <path d="M 200 180 Q 250 145 300 170 T 360 160" />
    <path d="M 240 165 Q 290 130 340 155 T 400 145" />
  </g>

  <!-- Tag badge -->
  <rect x="20" y="20" width="180" height="40" rx="20" fill="#dc2626" />
  <text x="110" y="46" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">SUPER FINE NYLON</text>
</svg>
