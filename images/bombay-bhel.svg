<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed" />
      <stop offset="100%" stop-color="#ffedd5" />
    </linearGradient>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bbGrad)" />
  <circle cx="300" cy="200" r="170" fill="#fed7aa" opacity="0.4" />

  <!-- Premium Plate -->
  <ellipse cx="300" cy="260" rx="210" ry="50" fill="#cbd5e1" opacity="0.4" />
  <ellipse cx="300" cy="240" rx="200" ry="45" fill="url(#plateGrad)" />
  <ellipse cx="300" cy="235" rx="180" ry="38" fill="#1e293b" />

  <!-- Crunchy Fried Noodles (Bombay Bhel) -->
  <g stroke="#ea580c" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M 180 230 Q 220 180 270 240 T 360 190 T 430 230" />
    <path d="M 160 210 Q 210 150 260 220 T 350 170 T 420 220" />
    <path d="M 200 240 Q 250 170 300 230 T 390 180 T 440 210" />
    <path d="M 190 200 Q 240 140 290 210 T 370 160 T 410 200" />
    <path d="M 220 220 Q 270 160 320 210 T 380 170" />
  </g>
  <g stroke="#f59e0b" stroke-width="4.5" stroke-linecap="round" fill="none">
    <path d="M 210 210 Q 250 165 300 220 T 370 180 T 420 210" />
    <path d="M 175 220 Q 225 175 275 230 T 355 185 T 415 225" />
    <path d="M 230 195 Q 280 150 330 205 T 400 175" />
    <!-- Spice sprinkles -->
  </g>
  <g fill="#dc2626">
    <circle cx="240" cy="190" r="3.5" />
    <circle cx="280" cy="210" r="3" />
    <circle cx="330" cy="180" r="4" />
    <circle cx="360" cy="205" r="3.5" />
    <circle cx="210" cy="220" r="3" />
    <circle cx="390" cy="190" r="3.5" />
  </g>

  <!-- Tag badge -->
  <rect x="20" y="20" width="220" height="40" rx="20" fill="#ea580c" />
  <text x="130" y="46" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">BOMBAY BHEL NOODLES</text>
</svg>
