<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="mixGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="100%" stop-color="#ffe4e6" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#mixGrad)" />
  <circle cx="300" cy="200" r="170" fill="#fecdd3" opacity="0.4" />

  <!-- Wooden Bowl -->
  <path d="M 130 190 C 130 310, 470 310, 470 190 Z" fill="#854d0e" />
  <ellipse cx="300" cy="190" rx="170" ry="32" fill="#a16207" />
  <ellipse cx="300" cy="185" rx="160" ry="28" fill="#ca8a04" />

  <!-- Chunky Ratlami / Gathiya / Peanuts mixture -->
  <g stroke="#b45309" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M 180 180 Q 230 150 280 185" />
    <path d="M 240 170 Q 290 140 340 175" />
    <path d="M 310 180 Q 360 145 420 180" />
    <path d="M 210 190 Q 260 160 310 195" />
    <path d="M 280 190 Q 330 155 380 190" />
  </g>
  <!-- Peanuts and spices -->
  <g fill="#7c2d12">
    <ellipse cx="230" cy="175" rx="12" ry="7" transform="rotate(30 230 175)" />
    <ellipse cx="290" cy="165" rx="11" ry="6" transform="rotate(-20 290 165)" />
    <ellipse cx="350" cy="170" rx="13" ry="8" transform="rotate(45 350 170)" />
    <ellipse cx="380" cy="180" rx="11" ry="7" transform="rotate(-15 380 180)" />
  </g>
  <g fill="#dc2626">
    <circle cx="200" cy="170" r="3" />
    <circle cx="260" cy="180" r="3" />
    <circle cx="320" cy="160" r="3" />
    <circle cx="410" cy="175" r="3" />
  </g>

  <!-- Tag badge -->
  <rect x="20" y="20" width="220" height="40" rx="20" fill="#b91c1c" />
  <text x="130" y="46" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">SPICY RATLAMI & MIX</text>
</svg>
