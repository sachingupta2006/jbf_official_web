<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fefce8" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <radialGradient id="riceGrain" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#fef9c3" />
      <stop offset="100%" stop-color="#fef08a" />
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#mGrad)" />
  <circle cx="300" cy="200" r="170" fill="#fef08a" opacity="0.5" />
  
  <!-- Jute Sack / Bag silhouette -->
  <path d="M 140 180 C 140 280, 200 330, 300 330 C 400 330, 460 280, 460 180 C 460 160, 140 160, 140 180 Z" fill="#b45309" />
  <ellipse cx="300" cy="180" rx="160" ry="35" fill="#78350f" />
  <ellipse cx="300" cy="175" rx="150" ry="30" fill="#fef9c3" />

  <!-- Puffed Rice Puffs -->
  <g fill="url(#riceGrain)" stroke="#fef08a" stroke-width="1.5">
    <ellipse cx="250" cy="150" rx="20" ry="10" transform="rotate(-15 250 150)" />
    <ellipse cx="290" cy="140" rx="22" ry="11" transform="rotate(25 290 140)" />
    <ellipse cx="340" cy="145" rx="19" ry="10" transform="rotate(-30 340 145)" />
    <ellipse cx="220" cy="165" rx="21" ry="10" transform="rotate(10 220 165)" />
    <ellipse cx="270" cy="170" rx="23" ry="12" transform="rotate(-5 270 170)" />
    <ellipse cx="320" cy="168" rx="20" ry="10" transform="rotate(40 320 168)" />
    <ellipse cx="370" cy="160" rx="22" ry="11" transform="rotate(-20 370 160)" />
    <ellipse cx="240" cy="190" rx="19" ry="9" transform="rotate(35 240 190)" />
    <ellipse cx="300" cy="195" rx="22" ry="11" transform="rotate(-15 300 195)" />
    <ellipse cx="350" cy="185" rx="21" ry="10" transform="rotate(15 350 185)" />
    <ellipse cx="280" cy="125" rx="20" ry="10" transform="rotate(12 280 125)" />
    <ellipse cx="320" cy="120" rx="21" ry="11" transform="rotate(-25 320 120)" />
    <ellipse cx="200" cy="150" rx="18" ry="9" transform="rotate(45 200 150)" />
    <ellipse cx="390" cy="150" rx="19" ry="10" transform="rotate(-40 390 150)" />
  </g>

  <!-- Tag badge -->
  <rect x="20" y="20" width="190" height="40" rx="20" fill="#d97706" />
  <text x="115" y="46" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">CRISPY PUFFED RICE</text>
</svg>
